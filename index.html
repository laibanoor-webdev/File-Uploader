<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop File Uploader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>File Uploader</h1>
        <p class="subtitle">Upload JPG, PNG or GIF images</p>

        <div class="drop-area" id="dropArea">
            <div class="upload-icon">↑</div>
            <h2>Drag & Drop your image here</h2>
            <p>or</p>

            <label for="fileInput" class="browse-btn">Browse File</label>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif">

            <p class="file-types">Supported: JPG, PNG, GIF</p>
        </div>

        <p id="error"></p>

        <div class="preview-card" id="previewCard">
            <h3>Image Preview</h3>
            <img id="previewImage" src="" alt="Uploaded image preview">

            <div class="file-info">
                <span id="fileName"></span>
                <span id="fileSize"></span>
            </div>

            <div class="progress-wrapper">
                <div class="progress-top">
                    <span>Uploading...</span>
                    <span id="progressText">0%</span>
                </div>

                <div class="progress-bar">
                    <span id="progress"></span>
                </div>
            </div>

            <p class="success" id="successMessage">Upload complete!</p>

            <button id="removeBtn" class="remove-btn">Remove Image</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
